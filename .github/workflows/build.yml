name: Build multiplatform

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-windows-x64-jpackage:
    runs-on: windows-latest
    name: "Windows x64 - jpackage"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile
      - run: make build-python
      - run: make build-package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-jpackage
          path: |
            build/package/
            build/python/

  build-windows-x64-graal:
    runs-on: windows-latest
    name: "Windows x64 - GraalVM"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: graalvm-community
          components: native-image
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pefile
      - run: make build-python
      - run: make build-graal
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-graal
          path: |
            build/graal/
            build/python/

  build-windows-x86-jpackage:
    runs-on: windows-latest
    name: "Windows x86 - jpackage"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x86
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86
      - run: pip install pefile
      - run: make build-python
      - run: make build-package MVN_EXTRA_PROFILES=,win-x86
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86-jpackage
          path: |
            build/package/
            build/python/

  build-linux-x64-jpackage:
    runs-on: ubuntu-latest
    name: "Linux x64 - jpackage"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libssl-dev upx-ucl liblzma-dev xz-utils
      - run: make build-python
      - run: make build-package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-jpackage
          path: |
            build/package/
            build/python/

  build-linux-x64-graal:
    runs-on: ubuntu-latest
    name: "Linux x64 - GraalVM"
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: graalvm-community
          components: native-image
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libssl-dev upx-ucl liblzma-dev xz-utils
      - run: make build-python
      - run: make build-graal
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-graal
          path: |
            build/graal/
            build/python/

  build-web-docker:
    runs-on: ubuntu-latest
    name: "Web/Docker (GraalVM)"
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '17'
          distribution: graalvm-community
          components: native-image
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libssl-dev upx-ucl liblzma-dev xz-utils
      - run: make update-docker
      - uses: actions/upload-artifact@v4
        with:
          name: web-docker
          path: docker/
