name: Build multiplatform

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-windows-x64:
    runs-on: windows-latest
    name: "Build Windows x64"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (x64)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Python executable
        run: make build-python

      - name: Build web app
        run: make build-web

      - name: Build package with jpackage
        run: make build-package JP_TARGET=win-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/web/
            build/package/
            build/python/

  build-windows-x86:
    runs-on: windows-latest
    name: "Build Windows x86"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 (x86)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x86
          cache: maven

      - name: Set up Python (x86)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x86

      - name: Build Python executable
        run: make build-python

      - name: Build web app
        run: make build-web

      - name: Build package with jpackage
        run: make build-package JP_TARGET=win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: |
            build/web/
            build/package/
            build/python/

  build-macos-x64:
    runs-on: macos-13
    name: "Build macOS x64 (Intel)"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: brew install pkg-config openssl

      - name: Build Python executable
        run: make build-python

      - name: Build web app
        run: make build-web

      - name: Build package with jpackage
        run: make build-package JP_TARGET=mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-intel
          path: |
            build/web/
            build/package/
            build/python/

  build-linux-x64:
    runs-on: ubuntu-latest
    name: "Build Linux x64"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libffi-dev libssl-dev

      - name: Build Python executable
        run: make build-python

      - name: Build web app
        run: make build-web

      - name: Build package with jpackage
        run: make build-package JP_TARGET=linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            build/web/
            build/package/
            build/python/
